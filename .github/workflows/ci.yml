name: CI

# Runs on every push and every pull request so a submodule rebase that
# silently drops the vendor `commitDeferredChanges` fork edit gets caught by
# e2e/stroke-panel.spec.ts's undo tests instead of shipping unnoticed.
"on":
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo (with vendor submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Node 22: the vendor/excalidraw submodule's package.json pins
      # "engines.node": "18.0.0 - 22.x.x", and this repo's own .nvmrc pins 22.
      # Node 25 (the default on some local dev machines) falls outside that
      # range and made `yarn` unusable when this workflow was authored;
      # Node 22 is the newest version both the fork and this repo support.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install flow dependencies
        run: npm ci

      # scripts/build-excalidraw.mjs is the single source of truth for this
      # sequence (yarn install -> esbuild bundle -> tolerant tsc + artifact
      # verification) — it replaced this workflow's own bespoke steps so the
      # two could not drift apart again. See the script's header comment and
      # `.claude/memory/excalidraw-upgrade.md` for why the type-generation
      # step tolerates a non-zero tsc exit.
      - name: Build vendor Excalidraw package
        run: npm run build:excalidraw

      # This workflow exists specifically to catch a submodule rebase that
      # silently drops the vendor `commitDeferredChanges` fork edit (see the
      # comment at the top of this file). Assert directly on the built typings
      # here, right after the vendor build, instead of waiting for that loss
      # to surface later as a confusing typecheck or e2e failure.
      - name: Verify fork edit survived (commitDeferredChanges)
        working-directory: vendor/excalidraw/packages/excalidraw
        run: |
          grep -q "commitDeferredChanges" dist/types/excalidraw/components/App.d.ts || {
            echo "::error::vendor build: commitDeferredChanges missing from dist/types/excalidraw/components/App.d.ts — the vendor fork edit was dropped or rebased away";
            exit 1;
          }

      - name: Typecheck (flow)
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Chromium runs the whole suite; Firefox runs e2e/number-field.spec.ts
      # alone (see playwright.config.ts). That one spec exists because the panel
      # number field's spin buttons are browser-native chrome whose events
      # differ per engine — the feature shipped working in Chromium and doing
      # nothing at all in Firefox — and jsdom renders no spin buttons to test
      # against. Dropping firefox here would make that project skip silently.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: E2E tests
        run: npm run test:e2e
